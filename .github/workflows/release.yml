name: Release

# Trigger on GitHub Release creation (not tag push, not release edits).
# Editing release notes must never retarget an immutable semantic-version tag.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag to release (e.g., v1.7.1)'
        required: true

jobs:
  publish-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}

    steps:
      - name: Resolve immutable release tag
        id: resolve
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "❌ ERROR: release tag is required"
            exit 1
          fi

          # Resolve the annotated/lightweight tag to a commit SHA. Semantic
          # version tags are immutable — never delete/recreate them here.
          TAG_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" --jq .object.sha)
          OBJECT_TYPE=$(gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" --jq .object.type)
          if [ "$OBJECT_TYPE" = "tag" ]; then
            TAG_SHA=$(gh api "repos/${{ github.repository }}/git/tags/${TAG_SHA}" --jq .object.sha)
          fi

          if [ "$EVENT_NAME" = "release" ] && [ -n "${RELEASE_TARGET}" ]; then
            # When the release points at a branch name, resolve it and require
            # the immutable tag already sits on that commit. Never move the tag.
            if echo "$RELEASE_TARGET" | grep -Eq '^[0-9a-f]{7,40}$'; then
              EXPECTED="$RELEASE_TARGET"
            else
              EXPECTED=$(gh api "repos/${{ github.repository }}/commits/${RELEASE_TARGET}" --jq .sha)
            fi

            TAG_SHORT="${TAG_SHA:0:7}"
            EXPECTED_SHORT="${EXPECTED:0:7}"
            if [ "$TAG_SHORT" != "$EXPECTED_SHORT" ] && [ "$TAG_SHA" != "$EXPECTED" ]; then
              # Allow either full SHA or tip of the named ref matching the tag tip.
              if ! echo "$EXPECTED" | grep -q "^${TAG_SHA}" && ! echo "$TAG_SHA" | grep -q "^${EXPECTED}"; then
                echo "❌ ERROR: immutable tag ${TAG} (${TAG_SHA}) does not match release target ${RELEASE_TARGET} (${EXPECTED})"
                echo "Create a new version tag instead of retargeting ${TAG}."
                exit 1
              fi
            fi
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "✅ Using immutable tag ${TAG} at ${TAG_SHA}"

      - name: Checkout release tag commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and verify dist from tagged commit
        run: |
          set -euo pipefail
          npm run build
          npm run package

          DIST_SIZE=$(stat -f%z dist/index.js 2>/dev/null || stat -c%s dist/index.js)
          echo "📦 dist/index.js size: $DIST_SIZE bytes"

          if [ "$DIST_SIZE" -lt 1000000 ]; then
            echo "❌ ERROR: dist/index.js is too small ($DIST_SIZE bytes). Not properly bundled!"
            exit 1
          fi

          if grep -q "require.*@actions/core" dist/index.js; then
            echo "❌ ERROR: Found external requires in dist/index.js. Not properly bundled!"
            exit 1
          fi

          # Tagged release must already include an up-to-date dist. Do not
          # rewrite the immutable semantic-version tag onto a later commit.
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "❌ ERROR: building the tagged commit produced dist/ changes."
            echo "Commit an updated dist/ before creating the release tag."
            git status --porcelain dist/
            exit 1
          fi

          echo "✅ Tagged commit has a verified bundled dist"

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          files: ./dist/index.js

      - name: Create Release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: Release ${{ steps.resolve.outputs.tag }}
          body: |
            ## Changes in this Release

            See commit history for detailed changes.

            ### Installation
            ```yaml
            - uses: adept-at/adept-triage-agent@${{ steps.resolve.outputs.tag }}
              with:
                GITHUB_TOKEN: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
                OPENAI_API_KEY: ${{ '${{ secrets.OPENAI_API_KEY }}' }}
            ```

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for detailed usage instructions.
          files: ./dist/index.js

  update-major-tag:
    runs-on: ubuntu-latest
    needs: publish-release
    if: needs.publish-release.outputs.tag

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish-release.outputs.commit }}
          fetch-depth: 0

      - name: Update rolling major version tag only
        env:
          TAG: ${{ needs.publish-release.outputs.tag }}
          COMMIT: ${{ needs.publish-release.outputs.commit }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          MAJOR_VERSION=$(echo "$VERSION" | cut -d. -f1)

          git config user.name github-actions
          git config user.email github-actions@github.com

          # Only the rolling major tag (v1) may move. Semantic-version tags
          # remain immutable and are never deleted/recreated by this workflow.
          git tag -fa "v$MAJOR_VERSION" "$COMMIT" -m "Update major version tag to $TAG"
          git push origin "v$MAJOR_VERSION" --force

          echo "✅ Updated v$MAJOR_VERSION tag to point to $TAG ($COMMIT)"
